<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact Cards · Preview</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light;--primary-color:#008bba;--primary-text-color:#263238;--secondary-text-color:#66747c;--divider-color:#e3e7e9;--disabled-color:#a5afb5;--card-background-color:#fff;--secondary-background-color:#f2f5f6;--state-active-color:#008bba;--state-inactive-color:#89949b;--state-unavailable-color:#89949b;--state-light-active-color:#c78d00;--state-climate-heat-color:#e57722;--state-climate-cool-color:#008bba}
body{background:#f2f5f6;margin:24px}body.dark{color-scheme:dark;--primary-text-color:#e6edef;--secondary-text-color:#9caeb6;--divider-color:#35434a;--disabled-color:#66767e;--card-background-color:#202a30;--secondary-background-color:#2d3940;background:#141c21;color:#e6edef}
h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:var(--secondary-text-color)}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}nav select,nav button{font:inherit;padding:8px;border:1px solid var(--divider-color);background:var(--card-background-color);color:var(--primary-text-color);border-radius:8px}main{width:390px;max-width:100%;display:grid;gap:10px}section{min-width:0}section>small{display:block;font-size:11px;letter-spacing:.03em;color:var(--secondary-text-color);margin:8px 2px 5px}ha-card{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px;color:var(--primary-text-color)}#feedback{max-width:500px;min-height:18px;font-size:12px;color:var(--secondary-text-color)}
body.capture{margin:8px}body.capture>h1,body.capture>p,body.capture>nav{display:none}
</style>
<h1>Compact Cards</h1><p>모의 상태를 사용한 브라우저 미리보기 · 실제 기기에 명령을 보내지 않습니다.</p>
<nav><select aria-label="미리보기 너비"><option value="320">320px</option><option value="390" selected>390px</option><option value="760">760px</option></select><button id="theme">테마 변경</button><button id="offline">연결 상태 변경</button></nav><main></main><p id="feedback" role="status"></p>
<script src="preview-icons.js"></script><script>
// Minimal local HA visual primitives; actual HA provides its own components and icons.
customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px;color:var(--primary-text-color)}</style><slot></slot>';}});
customElements.define('ha-icon',class extends HTMLElement{connectedCallback(){this.attachShadow({mode:'open'});this.update();new MutationObserver(()=>this.update()).observe(this,{attributes:true,attributeFilter:['icon']});}update(){const paths={'power':'M12 2v10 M5 5a9 9 0 1 0 14 0','chevron-up':'m6 15 6-6 6 6','chevron-down':'m6 9 6 6 6-6','stop':'M6 6h12v12H6z','play':'m8 5 11 7-11 7z','pause':'M8 5v14M16 5v14','skip-next':'m5 5 10 7-10 7zM18 5v14','thermometer':'M9 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0','snowflake':'M12 2v20M3 7l18 10M3 17 21 7','fire':'M12 2C9 10 4 9 5 15a7 7 0 0 0 14-1c0-4-4-7-4-7s1 5-3 5z','water-percent':'M12 3C8 9 5 12 5 16a7 7 0 0 0 14 0c0-4-3-7-7-13z','fan':'M12 12c-9-1-7-12-1-9 3 2 2 5 1 9 5-8 13-1 8 3-3 2-6 0-8-3 3 9-8 12-9 6 0-4 5-5 9-6','brightness-6':'M12 3v2m0 14v2M3 12h2m14 0h2M6 6l1 1m10 10 1 1M6 18l1-1M17 7l1-1 M17 12a5 5 0 1 0-10 0 5 5 0 0 0 10 0'};const key=(this.getAttribute('icon')||'').replace('mdi:','');if(window.compactPreviewIcons?.[key]){this.shadowRoot.innerHTML=`<style>:host{display:inline-flex;align-items:center;justify-content:center}</style><svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="${window.compactPreviewIcons[key]}"/></svg>`;return;}this.shadowRoot.innerHTML=`<style>:host{display:inline-flex;align-items:center;justify-content:center}</style><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[key]||'M5 6h14v12H5zM8 9h8M8 12h8M8 15h5'}"/></svg>`;}});
</script><script src="../compact-cards.js"></script><script>
const state=(entity_id,state,attributes)=>({entity_id,state,attributes});
const initial={
'climate.room':state('climate.room','heat',{friendly_name:'거실 냉난방',temperature:23,current_temperature:21.5,min_temp:16,max_temp:30,target_temp_step:.5,supported_features:1,hvac_modes:['off','heat','cool','dry','fan_only','auto','heat_cool'],hvac_action:'heating'}),
'light.room':state('light.room','on',{friendly_name:'거실 조명',brightness:170,supported_color_modes:['color_temp'],min_color_temp_kelvin:2200,max_color_temp_kelvin:6500,color_temp_kelvin:3500}),
'cover.room':state('cover.room','open',{friendly_name:'거실 커튼',supported_features:15,current_position:65}),
'switch.room':state('switch.room','on',{friendly_name:'간접 조명'}),
'sensor.temperature':state('sensor.temperature','23.4',{friendly_name:'실내 온도',device_class:'temperature',unit_of_measurement:'°C'}),
'sensor.humidity':state('sensor.humidity','48',{friendly_name:'습도',device_class:'humidity',unit_of_measurement:'%'}),
'sensor.co2':state('sensor.co2','820',{friendly_name:'CO₂',device_class:'carbon_dioxide',unit_of_measurement:'ppm'}),
'sensor.now':state('sensor.now','123.4',{unit_of_measurement:'kWh'}),'sensor.previous':state('sensor.previous','140.8',{unit_of_measurement:'kWh'}),
'scene.relax':state('scene.relax','unknown',{friendly_name:'휴식'}),'script.night':state('script.night','off',{friendly_name:'취침'}),
'media_player.room':state('media_player.room','playing',{friendly_name:'거실 스피커',media_title:'가벼운 오후의 음악',media_artist:'Compact Radio',supported_features:1|2|4|8|16|32|128|512|16384,volume_level:.35})};
const scenario=new URLSearchParams(location.search).get('scenario');
if(scenario==='long'){initial['sensor.co2'].state='12345.6789';initial['sensor.temperature'].state='23.456';}
if(scenario==='muted'||scenario==='mute-only')initial['media_player.room'].attributes.is_volume_muted=true;
if(scenario==='mute-only')initial['media_player.room'].attributes.supported_features=1|8|32|16384;
const motionTimers=new Map();
const hass={states:structuredClone(initial),formatEntityState:s=>`${({heat:'난방',on:'켜짐',off:'꺼짐',open:'열림',closed:'닫힘',playing:'재생 중',paused:'일시정지'}[s.state]||s.state)} ${s.attributes.unit_of_measurement||''}`.trim(),callService:async(domain,service,data)=>{document.querySelector('#feedback').textContent='처리 중…';await new Promise(r=>setTimeout(r,450));const id=data.entity_id,s=hass.states[id];if(s){if(service==='toggle')s.state=s.state==='on'?'off':'on';if(service==='set_temperature')s.attributes.temperature=data.temperature;if(service==='set_hvac_mode'){s.state=data.hvac_mode;s.attributes.hvac_action=({off:'off',fan_only:'fan',heat:'heating',cool:'cooling',dry:'drying'}[data.hvac_mode]||'idle');}if(service==='turn_on'){s.state='on';if(data.brightness_pct!=null)s.attributes.brightness=data.brightness_pct*255/100;if(data.color_temp_kelvin)s.attributes.color_temp_kelvin=data.color_temp_kelvin;}if(service==='turn_off')s.state='off';if(service==='set_cover_position')s.attributes.current_position=data.position;if(['open_cover','close_cover'].includes(service)){clearTimeout(motionTimers.get(id));s.state=service==='open_cover'?'opening':'closing';motionTimers.set(id,setTimeout(()=>{s.state=service==='open_cover'?'open':'closed';s.attributes.current_position=service==='open_cover'?100:0;refresh();},900));}if(service==='stop_cover'){clearTimeout(motionTimers.get(id));s.state=s.attributes.current_position===0?'closed':'open';}if(service==='media_pause')s.state='paused';if(service==='media_play')s.state='playing';if(service==='volume_set')s.attributes.volume_level=data.volume_level;if(service==='volume_mute')s.attributes.is_volume_muted=data.is_volume_muted;}document.querySelector('#feedback').textContent=`${domain}.${service} 완료`;refresh();}};
const configs=[['compact-climate-row','냉난방',{entity:'climate.room'}],['compact-home-panel','홈 패널',{items:[{type:'heading',name:'거실',badges:[{entity:'sensor.temperature',name:'온도'}]},{entity:'switch.room'},{entity:'sensor.humidity'},{type:'comparison',rows:[{name:'전기',entity:'sensor.now',previous:'sensor.previous'}]}]}],['compact-light-row','조명',{entity:'light.room'}],['compact-cover-row','커튼',{entity:'cover.room'}],['compact-scene-panel','장면',{items:[{entity:'scene.relax',name:'휴식'},{entity:'script.night',name:'취침'}]}],['compact-environment-panel','환경',{items:[{entity:'sensor.temperature',name:'온도'},{entity:'sensor.humidity',name:'습도'},{entity:'sensor.co2',name:'CO₂'}]}],['compact-media-row','미디어',{entity:'media_player.room'}]];
if(new URLSearchParams(location.search).get('capture')==='true')document.body.classList.add('capture');
const selected=new URLSearchParams(location.search).get('card');
for(const [type,label,config]of configs){if(selected&&type!==selected)continue;if(!customElements.get(type))continue;const section=document.createElement('section'),title=document.createElement('small'),card=document.createElement(type);title.textContent=label;try{card.setConfig(config);card.hass=hass;section.append(title,card);document.querySelector('main').append(section);
if(new URLSearchParams(location.search).get('editor')==='true'&&card.constructor.getConfigElement){Promise.resolve(card.constructor.getConfigElement()).then(editor=>{editor.setConfig({type:'custom:'+type,...config});editor.hass=hass;editor.addEventListener('config-changed',event=>{try{card.setConfig(event.detail.config);card.hass=hass;document.querySelector('#feedback').textContent='설정 미리보기 반영 완료';}catch(error){document.querySelector('#feedback').textContent=error.message;}});section.append(editor);});}}catch(e){document.querySelector('#feedback').textContent=e.message;}}
function refresh(){document.querySelectorAll('main section').forEach(section=>{for(const child of section.children)if('hass' in child)child.hass={...hass};});}
document.querySelector('select').onchange=e=>document.querySelector('main').style.width=e.target.value+'px';document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');let offline=false;document.querySelector('#offline').onclick=()=>{offline=!offline;for(const [id,s]of Object.entries(hass.states))s.state=offline?'unavailable':initial[id].state;refresh();};document.addEventListener('hass-more-info',e=>document.querySelector('#feedback').textContent=`${e.detail.entityId} 상세 정보`);
</script></html>
