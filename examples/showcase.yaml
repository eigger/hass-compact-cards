# HTML showcase와 동일한 카드 설정입니다. 엔티티 ID는 실제 환경에 맞게 변경하세요.
title: "Compact Cards"
views:
  - title: "홈"
    path: "compact-showcase"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
        cards:
          - type: "heading"
            heading: "거실"
          - type: "custom:compact-environment-panel"
            items:
              - entity: "sensor.living_temperature"
                name: "온도"
              - entity: "sensor.living_humidity"
                name: "습도"
              - entity: "sensor.living_co2"
                name: "CO₂"
          - type: "custom:compact-climate-row"
            entity: "climate.living_room"
            name: "냉난방"
          - type: "custom:compact-light-row"
            entity: "light.living_room"
            name: "거실 조명"
          - type: "custom:compact-media-row"
            entity: "media_player.living_room"
            name: "거실 스피커"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "침실"
          - type: "custom:compact-environment-panel"
            items:
              - entity: "sensor.bedroom_temperature"
                name: "온도"
              - entity: "sensor.bedroom_humidity"
                name: "습도"
          - type: "custom:compact-climate-row"
            entity: "climate.bedroom"
            name: "냉난방"
          - type: "custom:compact-cover-row"
            entity: "cover.bedroom"
            name: "침실 커튼"
          - type: "custom:compact-light-row"
            entity: "light.bedroom"
            name: "침실 조명"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "집 전체"
          - type: "custom:compact-scene-panel"
            items:
              - entity: "scene.evening"
                name: "편안한 저녁"
                icon: "mdi:sofa-outline"
              - entity: "scene.reading"
                name: "독서"
                icon: "mdi:lightbulb-outline"
              - entity: "script.away"
                name: "외출"
                icon: "mdi:power"
              - entity: "script.good_night"
                name: "취침"
                icon: "mdi:weather-night"
          - type: "custom:compact-home-panel"
            columns: 2
            items:
              - type: "heading"
                name: "조명·전원"
              - entity: "light.kitchen"
                name: "주방"
              - entity: "switch.entryway"
                name: "현관"
              - entity: "switch.desk"
                name: "책상"
              - entity: "switch.balcony"
                name: "베란다"
              - type: "heading"
                name: "전기 사용량"
              - type: "comparison"
                rows:
                  - name: "전기"
                    entity: "sensor.electricity_this_month"
                    previous: "sensor.electricity_last_month"
